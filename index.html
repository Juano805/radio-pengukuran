<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Radio Penyiar Dashboard</title>
<style>
body{
background:#08142b;
font-family:Arial;
margin:0;
color:white;
text-align:center;
}
.container{
padding-top:30px;
}
.card{
width:800px;
margin:auto;
background:#18253d;
padding:30px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,0.5);
}
h1{
margin-top:0;
}
.gauge{
width:220px;
height:220px;
margin:auto;
border-radius:50%;
background:
conic-gradient(#00ff88 0deg,
#00ff88 300deg,
#2d3748 300deg,
#2d3748 360deg);
display:flex;
align-items:center;
justify-content:center;
}
.gauge-inner{
width:160px;
height:160px;
border-radius:50%;
background:#18253d;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
font-weight:bold;
color:#00ff88;
}
.stats{
display:flex;
justify-content:space-around;
margin-top:20px;
}
.stat{
background:#24324b;
padding:15px;
border-radius:10px;
width:140px;
}
.label{
font-size:14px;
color:#999;
}
.value{
font-size:28px;
font-weight:bold;
}
.history{
margin-top:30px;
}
.bararea{
display:flex;
justify-content:center;
align-items:flex-end;
gap:8px;
height:140px;
}
.bar{
background:#00ff88;
width:40px;
border-radius:6px 6px 0 0;
}
button{
margin-top:25px;
padding:12px 20px;
font-size:16px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00ff88;
font-weight:bold;
}
.online{
color:#00ff88;
font-weight:bold;
margin-bottom:15px;
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>RADIO PENYIAR</h1>
<div class="online">
● ONLINE
</div>
<div class="gauge">
<div class="gauge-inner" id="nilai">
0%
</div>
</div>
<div class="stats">
<div class="stat">
<div class="label">MIN</div>
<div id="min" class="value">0</div>
</div>
<div class="stat">
<div class="label">AVG</div>
<div id="avg" class="value">0</div>
</div>
<div class="stat">
<div class="label">MAX</div>
<div id="max" class="value">0</div>
</div>
</div>
<div class="history">
<h3>Riwayat Pengukuran</h3>
<div id="bars" class="bararea"></div>
</div>
<button onclick="location.reload()">
Refresh Data
</button>
<p id="jam"></p>
</div>
</div>
<script>
function updateJam(){
document.getElementById("jam").innerHTML =
new Date().toLocaleString();
}
setInterval(updateJam,1000);
fetch("data.json")
.then(r=>r.json())
.then(data=>{
document.getElementById("nilai").innerHTML =
data.nilai + "%";
document.getElementById("min").innerHTML =
data.min + "%";
document.getElementById("avg").innerHTML =
data.avg + "%";
document.getElementById("max").innerHTML =
data.max + "%";
const bars =
document.getElementById("bars");
data.history.forEach(v=>{
const div =
document.createElement("div");
div.className="bar";
div.style.height =
v + "px";
bars.appendChild(div);
});
});
</script>
</body>
</html>
